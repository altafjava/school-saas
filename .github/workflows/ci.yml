name: CI — Compile & Test

on:
  # main deliberately excluded from push: a merge to main is the same commit the pull_request
  # trigger below already ran full CI against — re-running on the post-merge push is a redundant
  # third execution of an unchanged tree, not new signal. Matches platform-saas/.github/workflows/ci.yml.
  push:
    branches: [ "develop" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "develop", "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read    # required to pull com.altafjava.platform:* from GitHub Packages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Groups the push run and the auto-pr's own pull_request run under the same commit SHA so
# GitHub queues the second instead of dispatching both to the single self-hosted runner at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Compile & Test
    runs-on: self-hosted
    # Skip only the auto-pr job's own bot-created develop→main promotion PR (already tested by
    # the push run above) — a real PR from any other branch still runs full CI.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'develop' ||
      github.event.pull_request.base.ref != 'main'

    steps:
      - name: Checkout school-saas
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Self-hosted runner: ~/.gradle already persists on local disk between jobs, so
          # round-tripping it through GitHub's remote Actions cache (which this runner's network
          # path is slow to reach — see gradle/wrapper/gradle-wrapper.properties' networkTimeout)
          # is pure overhead, not a benefit; it was costing several minutes per job in cache
          # upload alone. Matches platform-saas's own ci.yml.
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
        run: ./gradlew compileJava compileTestJava --build-cache

      # Blocking — already configured (Eclipse formatter) but never enforced in CI before Phase 0.
      # No baseline concern here unlike coverage/mutation gates: a file either matches the
      # formatter's rules or it doesn't, so there's no "ratchet up from an unmeasured start" step.
      - name: Spotless (formatting)
        run: ./gradlew spotlessCheck --build-cache

      - name: Test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
          SPRING_PROFILES_ACTIVE: test
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
        run: ./gradlew test --build-cache

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/*/TEST-*.xml'

      - name: Archive Test Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      # Blocking — floors recorded in each module's build.gradle (TESTING.md §5 step 5).
      - name: Coverage Ratchet (JaCoCo)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
        run: ./gradlew jacocoTestCoverageVerification --build-cache

      - name: Archive Coverage Reports (JaCoCo)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jacoco-coverage-reports
          path: '**/build/reports/jacoco/'
          retention-days: 7

      # Blocking — zero-findings baseline (TESTING.md §5 step 7); config/spotbugs/exclude.xml
      # stays empty until a genuine false positive is found.
      - name: SpotBugs (static analysis)
        run: ./gradlew spotbugsMain --build-cache

      - name: Archive SpotBugs Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/'
          retention-days: 7

      # PIT needs a JDK 25 host JVM, not just a toolchain — see domain/build.gradle. Only this
      # step's JAVA_HOME changes; steps above ran on JDK 21.
      - name: Set up JDK 25 (for PIT — see domain/build.gradle)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Blocking, mutationThreshold/coverageThreshold = 70 (TESTING.md §5 step 6; domain/build.gradle).
      - name: Mutation Testing (PIT)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
        run: ./gradlew :domain:pitest --build-cache

      - name: Archive Mutation Testing Reports (PIT)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pitest-reports
          path: 'domain/build/reports/pitest/'
          retention-days: 7

  api-client:
    name: API Contract & Typed Client
    runs-on: self-hosted
    # Same duplicate-run guard as build-and-test above — see that job's comment.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'develop' ||
      github.event.pull_request.base.ref != 'main'
    env:
      SPEC: app/src/test/resources/openapi-snapshot.json
      # Pinned by digest: the diff report must not change under a PR because the tool moved.
      OASDIFF_IMAGE: tufin/oasdiff@sha256:37cded09a045370fcbebc95640e6269d2e3548a781e13ae0549cc34905c39d9c

    steps:
      - name: Checkout school-saas
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The committed snapshot is kept equal to the live spec by OpenApiSnapshotTest (build-and-test);
      # this job proves the snapshot still produces a client that type-checks, passes its tests and packs.
      - name: Install client dependencies
        working-directory: api-client
        run: npm ci

      - name: Generate client from the committed snapshot
        working-directory: api-client
        run: npm run generate

      - name: Type-check
        working-directory: api-client
        run: npm run typecheck

      - name: Test
        working-directory: api-client
        run: npm test

      - name: Build package
        working-directory: api-client
        run: npm run build

      # Makes the frontend impact of a contract change visible in review; the hard gate is the snapshot test.
      - name: API change report
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git show "origin/${{ github.base_ref }}:${SPEC}" > "${RUNNER_TEMP}/base.json"; then
            echo "No committed snapshot on ${{ github.base_ref }} yet; nothing to compare."
            exit 0
          fi
          cp "${SPEC}" "${RUNNER_TEMP}/head.json"
          oasdiff() { docker run --rm -v "${RUNNER_TEMP}:/spec" "${OASDIFF_IMAGE}" "$@"; }
          {
            echo "## Public API changes against ${{ github.base_ref }}"
            oasdiff changelog /spec/base.json /spec/head.json --format markdown | head -c 900000
          } >> "${GITHUB_STEP_SUMMARY}"
          BREAKING=$(oasdiff breaking /spec/base.json /spec/head.json --format singleline | grep -c '^error' || true)
          if [ "${BREAKING}" -gt 0 ]; then
            echo "::warning title=Breaking API change::${BREAKING} breaking change(s) to the public API - see the job summary. Frontend clients must be upgraded together."
          fi

  auto-pr:
    name: Auto PR → main
    runs-on: self-hosted
    needs: [ build-and-test, api-client ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Create or update PR → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          SUBJECT=$(printf '%s' "${{ github.event.head_commit.message }}" | head -1)
          TITLE="${BRANCH} → main: ${SUBJECT}"
          EXISTING=$(gh pr list --base main --head "${BRANCH}" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE"
            echo "Updated PR #$EXISTING title to: $TITLE"
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "$TITLE" \
              --body "Automated PR: all CI checks passed on \`${BRANCH}\`."
            echo "PR created: $TITLE"
          fi
