name: Performance Tests — Gatling

# Boots the real application with demo data on a schedule and runs every simulation against it.
# Failures raise an alert rather than block merging, because a shared runner's timings are noisy.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  gatling:
    name: Gatling Load Test
    runs-on: self-hosted
    steps:
      - name: Checkout school-saas
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start backing services
        run: docker compose up -d --wait

      - name: Start the application with demo data
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
          SCHOOL_DEMO_SEED: 'true'
        run: |
          nohup ./gradlew :app:bootRun > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 5
          done
          tail -100 app.log
          exit 1

      - name: Run Gatling simulations
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PLATFORM_SAAS_TOKEN: ${{ secrets.PLATFORM_SAAS_TOKEN }}
        run: ./gradlew :app:gatlingRun

      - name: Upload Gatling reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: gatling-reports-${{ github.run_id }}
          path: app/build/reports/gatling/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          pkill -f 'bootRun' || true
          docker compose down
