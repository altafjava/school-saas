<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="85.6mm" height="54mm" viewBox="0 0 856 540">
  <rect x="0" y="0" width="856" height="540" rx="28" fill="#ffffff"/>
  <rect x="0" y="0" width="856" height="120" fill="#1e3a5f"/>
  {{#tenantLogo}}<image x="28" y="18" width="84" height="84" preserveAspectRatio="xMidYMid meet" xlink:href="{{tenantLogo}}"/>{{/tenantLogo}}
  <text x="132" y="58" font-family="Noto Sans" font-size="36" font-weight="bold" fill="#ffffff">{{tenantName}}</text>
  <text x="132" y="96" font-family="Noto Sans" font-size="22" letter-spacing="4" fill="#c9d6e8">STAFF IDENTITY CARD</text>

  <rect x="36" y="150" width="210" height="260" rx="10" fill="#e8ecf1" stroke="#1e3a5f" stroke-width="2"/>
  {{#photo}}<image x="38" y="152" width="206" height="256" preserveAspectRatio="xMidYMid slice" xlink:href="{{photo}}"/>{{/photo}}

  <text x="280" y="186" font-family="Noto Sans" font-size="20" fill="#6e7781">NAME</text>
  <text x="280" y="224" font-family="Noto Sans" font-size="34" font-weight="bold" fill="#1e3a5f">{{employeeName}}</text>
  <text x="280" y="252" font-family="Noto Sans" font-size="22" fill="#52606d">{{designation}}</text>
  <text x="280" y="288" font-family="Noto Sans" font-size="20" fill="#6e7781">EMPLOYEE CODE</text>
  <text x="280" y="322" font-family="Noto Sans" font-size="28" fill="#1f2933">{{employeeCode}}</text>
  <text x="280" y="368" font-family="Noto Sans" font-size="20" fill="#6e7781">DEPARTMENT</text>
  <text x="280" y="402" font-family="Noto Sans" font-size="28" fill="#1f2933">{{department}}</text>

  {{#verificationQr}}<image x="676" y="300" width="150" height="150" xlink:href="{{verificationQr}}"/>{{/verificationQr}}
  <rect x="0" y="470" width="856" height="70" fill="#1e3a5f"/>
  <text x="36" y="514" font-family="Noto Sans" font-size="20" fill="#c9d6e8">Issued {{issuedOn}}</text>
  <text x="820" y="514" text-anchor="end" font-family="Noto Sans" font-size="20" fill="#c9d6e8">Verify: {{verificationCode}}</text>
</svg>
