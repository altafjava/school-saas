<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="85.6mm" height="54mm" viewBox="0 0 856 540">
  <rect x="0" y="0" width="856" height="540" rx="28" fill="#ffffff"/>
  <rect x="0" y="0" width="856" height="120" fill="#7a2e0e"/>
  {{#tenantLogo}}<image x="28" y="18" width="84" height="84" preserveAspectRatio="xMidYMid meet" xlink:href="{{tenantLogo}}"/>{{/tenantLogo}}
  <text x="132" y="58" font-family="Noto Sans" font-size="36" font-weight="bold" fill="#ffffff">{{tenantName}}</text>
  <text x="132" y="96" font-family="Noto Sans" font-size="22" letter-spacing="6" fill="#f3d5c6">VISITOR</text>

  <rect x="36" y="150" width="210" height="260" rx="10" fill="#e8ecf1" stroke="#7a2e0e" stroke-width="2"/>
  {{#photo}}<image x="38" y="152" width="206" height="256" preserveAspectRatio="xMidYMid slice" xlink:href="{{photo}}"/>{{/photo}}

  <text x="280" y="186" font-family="Noto Sans" font-size="20" fill="#6e7781">NAME</text>
  <text x="280" y="224" font-family="Noto Sans" font-size="34" font-weight="bold" fill="#7a2e0e">{{visitorName}}</text>
  <text x="280" y="276" font-family="Noto Sans" font-size="20" fill="#6e7781">VISITING</text>
  <text x="280" y="310" font-family="Noto Sans" font-size="28" fill="#1f2933">{{hostName}}</text>
  <text x="280" y="362" font-family="Noto Sans" font-size="20" fill="#6e7781">VALID ON</text>
  <text x="280" y="396" font-family="Noto Sans" font-size="28" fill="#1f2933">{{validOn}}</text>

  {{#verificationQr}}<image x="676" y="300" width="150" height="150" xlink:href="{{verificationQr}}"/>{{/verificationQr}}
  <rect x="0" y="470" width="856" height="70" fill="#7a2e0e"/>
  <text x="36" y="514" font-family="Noto Sans" font-size="20" fill="#f3d5c6">Return this badge when you leave</text>
  <text x="820" y="514" text-anchor="end" font-family="Noto Sans" font-size="20" fill="#f3d5c6">Verify: {{verificationCode}}</text>
</svg>
