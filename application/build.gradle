plugins {
    id 'java-library'
    id 'jacoco'
}

// Line/branch coverage reporting for this module.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage ratchet (TESTING.md §2/§5 step 5) — floor = the line coverage this module actually
// measures at the end of Phase 3 (74.9%, recorded 2026-08-16), not the 80% aspirational target
// from TESTING.md's table. See domain/build.gradle for the full rationale.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.74
            }
        }
    }
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

dependencies {
    api project(':domain')
    // Platform application — exposes JobExecutionStrategy, events, EventPublisher
    api 'com.altafjava.platform:application'

    // Spring Security and Jackson are implementation-scoped in the platform's application module
    // so they are not transitively visible — declare them explicitly here, matching api/build.gradle.
    // StudentDataAccessGuard/GuardianService read Authentication/SecurityContextHolder/
    // AccessDeniedException; GradingScaleService (de)serializes the tenant-configurable grading
    // scale to/from TenantSettingOverride's JSON value.
    implementation libs.spring.boot.starter.security
    implementation libs.jackson.databind

    // Report card PDF generation (ReportCardService) and bulk student-roster CSV import
    // (StudentBulkImportService) — see ROADMAP.md Phase 3.
    implementation libs.openpdf
    implementation libs.commons.csv

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    // jakarta.servlet-api is compileOnly in the platform's application module (a servlet container
    // provides it at runtime), so it's absent from the published POM. NoOpActivityLogService (audit
    // test fixture) extends ActivityLogService, whose private getClientIp(HttpServletRequest)
    // otherwise fails JUnit's test-discovery reflection with NoClassDefFoundError.
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}
