apiVersion: v1
kind: ConfigMap
metadata:
  name: school-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # school-saas resolves DB_HOST/DB_PORT/DB_NAME separately (see application-prod.yml),
  # unlike platform-saas's single SPRING_DATASOURCE_URL — keep these in sync with that contract.
  # Required choices with no application default. Review each one before deploying.
  TAX_PROVIDER: "none"
  EXCHANGE_RATE_PROVIDER: "none"
  VIRUS_SCAN_ENABLED: "false"
  # CIDRs of the BFF and load balancers. Empty means X-Forwarded-For is never believed.
  TRUSTED_PROXIES: ""
  DB_HOST: "mariadb-service"
  DB_PORT: "3306"
  DB_NAME: "school_saas"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: "rabbitmq-service"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_ELASTICSEARCH_URIS: "http://elasticsearch-service:9200"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  # Micrometer Tracing — Brave/Zipkin bridge
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
  # Tracing stack is OTel (inherited from platform-saas's spring-boot-starter), not Zipkin/Brave —
  # endpoint matches the OTLP HTTP exporter's default port.
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4318/v1/traces"
