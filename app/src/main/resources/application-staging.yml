spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: school-saas-staging-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

scheduler:
  datasource:
    # Quartz's job-store pool is independent of the main app datasource (see spring.datasource
    # above); platform-defaults.yml ships no DB_NAME default, so it is required here too.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

tenant:
  resolution:
    # Required — platform-saas ships no default. Must resolve to the public base domain
    # school-saas is served on in this environment (e.g. staging.school-saas.example.com).
    base-domain: ${TENANT_BASE_DOMAIN}

security:
  cors:
    # Required — platform-saas ships no default. Comma-separated frontend origin(s) for this
    # environment, e.g. https://staging-app.school-saas.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  security:
    jwt:
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      key-id: ${JWT_KEY_ID:platform-key-1}
      expiration: ${JWT_EXPIRATION:900000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

platform:
  # Required, with no defaults: a deployment must choose each one, 'none' or 'false' included.
  security:
    # CIDRs of the BFF and load balancers. Only these may set X-Forwarded-For.
    trusted-proxies: ${TRUSTED_PROXIES:}
    encryption:
      key: ${PLATFORM_ENCRYPTION_KEY}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoint:
    health:
      show-details: when-authorized
