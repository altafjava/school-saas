plugins {
    id 'java-library'
    id 'jacoco'
    alias(libs.plugins.pitest)
}

// Line/branch coverage reporting. See TESTING.md §2/§5.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

dependencies {
    // Platform core — exposes TenantEntity, BaseEntity, @Pii, TenantContext, etc.
    api 'com.altafjava.platform:core'
    // Country-aware phone validation (PhoneNumberValidator) — a plain utility library with no
    // Spring/Jakarta dependency of its own, safe for a pure domain service to depend on directly.
    implementation libs.libphonenumber
    // Plain data-marshalling library (no Spring/JPA/HTTP coupling) backing
    // PayComponentAmountListConverter's JSON column conversion.
    implementation libs.jackson.databind
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.pitest.junit5.plugin
}

// PIT mutation testing. Run with: ./gradlew :domain:pitest
//
// Scoped to grade calculation and fee balance, not all of `domain` — the rest is still untested
// Phase 0 entities, and PIT against untested code just reports NO_COVERAGE everywhere. Widen
// targetClasses/targetTests as more of `domain` gains real tests.
//
// pitestVersion overrides the plugin's own bundled default, which predates Java 25 and crashes
// reading this project's class files ("Unsupported class file major version 69"). This task also
// needs a JDK 25 *host* JVM (JAVA_HOME), not just the project's toolchain — the plugin has no
// toolchain support and its subprocess inherits whatever JDK launched Gradle. Full details:
// TESTING.md §0/§5.
pitest {
    // Exact classes, not a package wildcard — grade.model/fee.model also hold JPA entities
    // (Grade, FeeStructure, FeePayment) with no dedicated unit tests yet.
    targetClasses = ['com.altafjava.school.domain.grade.service.*',
                      'com.altafjava.school.domain.grade.model.GradingScale',
                      'com.altafjava.school.domain.grade.model.GradeThreshold',
                      'com.altafjava.school.domain.fee.service.*',
                      'com.altafjava.school.domain.attendance.service.*',
                      'com.altafjava.school.domain.payroll.service.*']
    targetTests = ['com.altafjava.school.domain.grade.*', 'com.altafjava.school.domain.fee.*',
                    'com.altafjava.school.domain.attendance.*',
                    'com.altafjava.school.domain.payroll.*']
    pitestVersion = libs.versions.pitest.core.get()
    junit5PluginVersion = libs.versions.pitest.junit5.plugin.get()
    mutationThreshold = 85
    coverageThreshold = 95
    excludedMethods = ['hashCode', 'equals', 'toString', 'canEqual']
    outputFormats = ['HTML', 'XML']
    threads = 4
    avoidCallsTo = ['java.util.logging', 'org.slf4j', 'org.apache.log4j']
    failWhenNoMutations = false
    timestampedReports = false
}
